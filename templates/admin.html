{% extends "base.html" %} {% block title %}Admin Panel{% endblock %} {% block
content %}
<div class="d-flex justify-content-between align-items-center">
  <h1>Admin Panel</h1>
  <a href="{{ url_for('add_project') }}" class="btn btn-success"
    >Add New Project</a
  >
</div>
<hr />
<ul class="list-group">
  {% for project in projects %}
  <li class="list-group-item d-flex justify-content-between align-items-center">
    {{ project.title }}
    <div>
      <a
        href="{{ url_for('edit_project', project_id=project.id) }}"
        class="btn btn-secondary btn-sm"
        >Edit</a
      >
      <form
        action="{{ url_for('delete_project', project_id=project.id) }}"
        method="POST"
        style="display: inline"
      >
        <input
          type="submit"
          value="Delete"
          class="btn btn-danger btn-sm"
          onclick="return confirm('Are you sure you want to delete this project?');"
        />
      </form>
    </div>
  </li>
  {% else %}
  <li class="list-group-item">No projects found.</li>
  {% endfor %}
</ul>
{% endblock %}
